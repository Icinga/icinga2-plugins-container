name: Container Image

on:
  push:
    branches:
      - main
  pull_request: {}
  release:
    types:
      - published
  workflow_dispatch:

env:
  IMAGE_NAME: "icinga/icinga2-plugins-container"

jobs:
  container-image:
    name: ${{ matrix.debian_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Build oldstable for the legacy docker-icinga2, stable for Icinga 2.16
        # and later, and testing to be prepared for the future.
        debian_version:
          - bookworm
          - trixie
          - forky

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.documentation=https://github.com/Icinga/icinga2-plugins-container
            org.opencontainers.image.vendor=Icinga GmbH
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.debian_version }},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{version}},suffix=-${{ matrix.debian_version }}
            type=edge,suffix=-${{ matrix.debian_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container image for testing
        id: build-test
        uses: docker/build-push-action@v7
        with:
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian_version }}
          context: .
          file: ./Containerfile
          # Only test amd64 is tested; all checks are scripts.
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/plugins-oci,tar=false
          provenance: false
          sbom: false

      - name: Build test Container image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian_version }}
          build-contexts: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.debian_version }}=oci-layout://${{ runner.temp }}/plugins-oci@${{ steps.build-test.outputs.digest }}
          context: .
          file: ./.github/workflows/container-image.Containerfile
          platforms: linux/amd64
          load: true
          tags: icinga2-plugins-container-test

      - name: Run test Container image
        run: docker run --rm icinga2-plugins-container-test

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Container image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian_version }}
          context: .
          file: ./Containerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generate artifact attestation for GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: false
